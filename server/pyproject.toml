[project]
name = "dt5742b-daq"
version = "0.1.0"
description = "Dead-simple, fast, bulletproof DAQ for the CAEN DT5742B"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "numpy>=1.26",
]

[project.scripts]
daq = "daq.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["daq*"]
